#
# Copy to .github/workflows/ next to sync.yml; it installs the same pinned
# release. Force and prune are offered here, but Forge Sync refuses them unless
# the target's reviewed configuration allows them. Protect this workflow's
# branch: the form is not authorization.
name: Advanced Sync
on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination
        type: choice
        default: gitlab
        options: [gitlab, github, all]
      include:
        description: Forge data to copy with Git
        type: choice
        default: git
        options: [git, issues, pull_requests, issues_and_pull_requests, labels_and_milestones, releases, all]
      mode:
        description: Preview makes no remote writes
        type: choice
        default: preview
        options: [preview, apply]
      missing_target:
        description: Missing target repository
        type: choice
        default: require
        options: [require, skip, create-private]
      push:
        description: Push behavior
        type: choice
        default: no-force
        options: [no-force, allow-force]
      extra_refs:
        description: Extra target branches and tags
        type: choice
        default: keep
        options: [keep, prune]
      description_policy:
        description: Target description
        type: choice
        default: on-create
        options: [leave, copy, on-create, configured]
      refs:
        description: Branches
        type: choice
        default: config
        options: [config, default, 'set:release']
      wiki:
        description: Wiki
        type: choice
        default: config
        options: [config, include, exclude]
      lfs:
        description: Git LFS
        type: choice
        default: config
        options: [config, include, exclude]
      target_settings:
        description: Existing target settings
        type: choice
        default: leave
        options: [leave, apply]
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install digest-pinned Forge Sync
        env:
          FORGE_SYNC_VERSION: ${{ vars.FORGE_SYNC_VERSION }}
          FORGE_SYNC_ARCHIVE_SHA256: ${{ vars.FORGE_SYNC_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          archive="forge-sync-${FORGE_SYNC_VERSION}-linux-x86_64.tar.gz"
          stage=$(mktemp -d)
          curl --fail --location --proto '=https' --silent --show-error --output "$stage/$archive" \
            "https://codefloe.com/itiquette/forge-sync/releases/download/v${FORGE_SYNC_VERSION}/$archive"
          printf '%s  %s\n' "$FORGE_SYNC_ARCHIVE_SHA256" "$stage/$archive" | sha256sum --check --strict -
          tar -xzf "$stage/$archive" -C "$stage"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$stage/${archive%.tar.gz}/forge-sync" "$RUNNER_TEMP/bin/forge-sync"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: >-
          forge-sync --format plain --config-file ci/forgesync.yaml sync --group production/upstream --target "$SYNC_TARGET" --include "$SYNC_INCLUDE" --mode "$SYNC_MODE" --missing-target "$SYNC_MISSING_TARGET" --push "$SYNC_PUSH" --extra-refs "$SYNC_EXTRA_REFS" --description "$SYNC_DESCRIPTION" --refs "$SYNC_REFS" --wiki "$SYNC_WIKI" --lfs "$SYNC_LFS" --target-settings "$SYNC_TARGET_SETTINGS"
        env:
          SYNC_TARGET: ${{ inputs.target }}
          SYNC_INCLUDE: ${{ inputs.include }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_MISSING_TARGET: ${{ inputs.missing_target }}
          SYNC_PUSH: ${{ inputs.push }}
          SYNC_EXTRA_REFS: ${{ inputs.extra_refs }}
          SYNC_DESCRIPTION: ${{ inputs.description_policy }}
          SYNC_REFS: ${{ inputs.refs }}
          SYNC_WIKI: ${{ inputs.wiki }}
          SYNC_LFS: ${{ inputs.lfs }}
          SYNC_TARGET_SETTINGS: ${{ inputs.target_settings }}
          FSYNC_FORGEJO_TOKEN: ${{ secrets.FSYNC_FORGEJO_TOKEN }}
          FSYNC_GITLAB_TOKEN: ${{ inputs.target != 'github' && secrets.FSYNC_GITLAB_TOKEN || '' }}
          FSYNC_GITHUB_TOKEN: ${{ inputs.target != 'gitlab' && secrets.FSYNC_GITHUB_TOKEN || '' }}
