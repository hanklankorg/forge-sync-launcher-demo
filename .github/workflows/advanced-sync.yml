#
# Copy to .github/workflows/ next to sync.yml; it installs the same pinned
# release. Force and prune are offered here, but Forge Sync refuses them unless
# the target's reviewed configuration allows them. Protect this workflow's
# branch: the form is not authorization.
name: Advanced Sync
on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination
        type: choice
        default: gitlab.example.com/your-group
        options: [gitlab.example.com/your-group, github.com/your-org, all]
      mode:
        description: Preview makes no remote writes
        type: choice
        default: preview
        options: [preview, apply]
      issues:
        description: Issues
        type: boolean
        default: false
      pull_requests:
        description: Pull request records
        type: boolean
        default: false
      labels:
        description: Labels
        type: boolean
        default: false
      milestones:
        description: Milestones
        type: boolean
        default: false
      releases:
        description: Releases
        type: boolean
        default: false
      wiki:
        description: Wiki
        type: boolean
        default: false
      lfs:
        description: Git LFS objects
        type: boolean
        default: false
      missing_target:
        description: Missing target repository
        type: choice
        default: require
        options: [require, skip, create-private]
      push:
        description: Push behavior
        type: choice
        default: no-force
        options: [no-force, allow-force]
      extra_refs:
        description: Extra target branches and tags
        type: choice
        default: keep
        options: [keep, prune]
      description_policy:
        description: Target description
        type: choice
        default: on-create
        options: [leave, copy, on-create, configured]
      refs:
        description: Branches
        type: choice
        default: config
        options: [config, default, 'set:release']
      target_settings:
        description: Existing target settings
        type: choice
        default: leave
        options: [leave, apply]
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install digest-pinned Forge Sync
        env:
          FORGE_SYNC_VERSION: ${{ vars.FORGE_SYNC_VERSION }}
          FORGE_SYNC_ARCHIVE_SHA256: ${{ vars.FORGE_SYNC_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          archive="forge-sync-${FORGE_SYNC_VERSION}-linux-x86_64.tar.gz"
          stage=$(mktemp -d)
          curl --fail --location --proto '=https' --silent --show-error --output "$stage/$archive" \
            "https://codefloe.com/itiquette/forge-sync/releases/download/v${FORGE_SYNC_VERSION}/$archive"
          printf '%s  %s\n' "$FORGE_SYNC_ARCHIVE_SHA256" "$stage/$archive" | sha256sum --check --strict -
          tar -xzf "$stage/$archive" -C "$stage"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$stage/${archive%.tar.gz}/forge-sync" "$RUNNER_TEMP/bin/forge-sync"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          include=git
          for choice in "issues:$SYNC_ISSUES" "pull_requests:$SYNC_PULL_REQUESTS" "labels:$SYNC_LABELS" "milestones:$SYNC_MILESTONES" "releases:$SYNC_RELEASES" "wiki:$SYNC_WIKI" "lfs:$SYNC_LFS"; do
            case "$choice" in *:true) include="$include,${choice%:*}" ;; esac
          done
          forge-sync --format plain --config-file ci/forgesync.yaml sync --group production/upstream --target "$SYNC_TARGET" --include "$include" --mode "$SYNC_MODE" --missing-target "$SYNC_MISSING_TARGET" --push "$SYNC_PUSH" --extra-refs "$SYNC_EXTRA_REFS" --description "$SYNC_DESCRIPTION" --refs "$SYNC_REFS" --target-settings "$SYNC_TARGET_SETTINGS"
        env:
          SYNC_TARGET: ${{ inputs.target }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_ISSUES: ${{ inputs.issues }}
          SYNC_PULL_REQUESTS: ${{ inputs.pull_requests }}
          SYNC_LABELS: ${{ inputs.labels }}
          SYNC_MILESTONES: ${{ inputs.milestones }}
          SYNC_RELEASES: ${{ inputs.releases }}
          SYNC_WIKI: ${{ inputs.wiki }}
          SYNC_LFS: ${{ inputs.lfs }}
          SYNC_MISSING_TARGET: ${{ inputs.missing_target }}
          SYNC_PUSH: ${{ inputs.push }}
          SYNC_EXTRA_REFS: ${{ inputs.extra_refs }}
          SYNC_DESCRIPTION: ${{ inputs.description_policy }}
          SYNC_REFS: ${{ inputs.refs }}
          SYNC_TARGET_SETTINGS: ${{ inputs.target_settings }}
          FSYNC_FORGEJO_TOKEN: ${{ secrets.FSYNC_FORGEJO_TOKEN }}
          # Add one such line per mirror in ci/forgesync.yaml.
          FSYNC_GITLAB_TOKEN: ${{ (inputs.target == 'gitlab.example.com/your-group' || inputs.target == 'all') && secrets.FSYNC_GITLAB_TOKEN || '' }}
          FSYNC_GITHUB_TOKEN: ${{ (inputs.target == 'github.com/your-org' || inputs.target == 'all') && secrets.FSYNC_GITHUB_TOKEN || '' }}
