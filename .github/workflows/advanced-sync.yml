#
# Copy to .github/workflows/ next to sync.yml; it installs the same pinned
# release. Force and prune are offered here, but Forge Sync refuses them unless
# the target's reviewed configuration allows them. Protect this workflow's
# branch: the form is not authorization.
name: Mirror to another forge (advanced)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Destination (Git branches and tags are always copied; all = every destination)"
        type: choice
        default: gitlab.example.com/your-group
        options: [gitlab.example.com/your-group, github.com/your-org, all]
      issues:
        description: "Also copy issues (with their labels and milestones)"
        type: boolean
        default: false
      pull_requests:
        description: "Also copy pull requests (as issues)"
        type: boolean
        default: false
      labels:
        description: "Also copy labels (without issues)"
        type: boolean
        default: false
      milestones:
        description: "Also copy milestones (without issues)"
        type: boolean
        default: false
      releases:
        description: "Also copy releases"
        type: boolean
        default: false
      wiki:
        description: "Also copy the wiki"
        type: boolean
        default: false
      replace_starter_wiki:
        description: "Replace GitHub's starter wiki page (first wiki copy only)"
        type: boolean
        default: false
      lfs:
        description: "Also copy Git LFS files (large files)"
        type: boolean
        default: false
      missing_target:
        description: "If the destination repository is missing: require = stop, skip = leave it out, create-private = create it private"
        type: choice
        default: require
        options: [require, skip, create-private]
      push:
        description: "If the destination has diverged: no-force = stop, allow-force = overwrite (the config must allow it)"
        type: choice
        default: no-force
        options: [no-force, allow-force]
      extra_refs:
        description: "Branches and tags only the destination has: keep, or prune = delete them (the config must allow it)"
        type: choice
        default: keep
        options: [keep, prune]
      description_policy:
        description: "Destination description: leave, copy = from the source, on-create = only for a new repository, configured = from the config"
        type: choice
        default: on-create
        options: [leave, copy, on-create, configured]
      refs:
        description: "Branches to copy: config = as configured, default = the default branch only, set:release = the config's release set"
        type: choice
        default: config
        options: [config, default, 'set:release']
      target_settings:
        description: "Settings of an existing destination: leave, or apply = visibility, topics and features from the config"
        type: choice
        default: leave
        options: [leave, apply]
      mode:
        description: "Preview shows what would change, apply copies"
        type: choice
        default: preview
        options: [preview, apply]
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install digest-pinned Forge Sync
        env:
          FORGE_SYNC_VERSION: ${{ vars.FORGE_SYNC_VERSION }}
          FORGE_SYNC_ARCHIVE_SHA256: ${{ vars.FORGE_SYNC_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          archive="forge-sync-${FORGE_SYNC_VERSION}-linux-x86_64.tar.gz"
          stage=$(mktemp -d)
          curl --fail --location --proto '=https' --silent --show-error --output "$stage/$archive" \
            "https://codefloe.com/itiquette/forge-sync/releases/download/v${FORGE_SYNC_VERSION}/$archive"
          printf '%s  %s\n' "$FORGE_SYNC_ARCHIVE_SHA256" "$stage/$archive" | sha256sum --check --strict -
          tar -xzf "$stage/$archive" -C "$stage"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$stage/${archive%.tar.gz}/forge-sync" "$RUNNER_TEMP/bin/forge-sync"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          include=git
          for choice in "issues:$SYNC_ISSUES" "pull_requests:$SYNC_PULL_REQUESTS" "labels:$SYNC_LABELS" "milestones:$SYNC_MILESTONES" "releases:$SYNC_RELEASES" "wiki:$SYNC_WIKI" "lfs:$SYNC_LFS"; do
            case "$choice" in *:true) include="$include,${choice%:*}" ;; esac
          done
          case "$SYNC_REPLACE_STARTER_WIKI" in true) set -- --replace-starter-wiki ;; esac
          forge-sync --format plain --config-file ci/forgesync.yaml sync --group production/upstream --target "$SYNC_TARGET" --include "$include" --mode "$SYNC_MODE" --missing-target "$SYNC_MISSING_TARGET" --push "$SYNC_PUSH" --extra-refs "$SYNC_EXTRA_REFS" --description "$SYNC_DESCRIPTION" --refs "$SYNC_REFS" --target-settings "$SYNC_TARGET_SETTINGS" "$@"
        env:
          SYNC_TARGET: ${{ inputs.target }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_ISSUES: ${{ inputs.issues }}
          SYNC_PULL_REQUESTS: ${{ inputs.pull_requests }}
          SYNC_LABELS: ${{ inputs.labels }}
          SYNC_MILESTONES: ${{ inputs.milestones }}
          SYNC_RELEASES: ${{ inputs.releases }}
          SYNC_WIKI: ${{ inputs.wiki }}
          SYNC_LFS: ${{ inputs.lfs }}
          SYNC_REPLACE_STARTER_WIKI: ${{ inputs.replace_starter_wiki }}
          SYNC_MISSING_TARGET: ${{ inputs.missing_target }}
          SYNC_PUSH: ${{ inputs.push }}
          SYNC_EXTRA_REFS: ${{ inputs.extra_refs }}
          SYNC_DESCRIPTION: ${{ inputs.description_policy }}
          SYNC_REFS: ${{ inputs.refs }}
          SYNC_TARGET_SETTINGS: ${{ inputs.target_settings }}
          FSYNC_FORGEJO_TOKEN: ${{ secrets.FSYNC_FORGEJO_TOKEN }}
          # Add one such line per destination in ci/forgesync.yaml, with the same name.
          FSYNC_GITLAB_TOKEN: ${{ (inputs.target == 'gitlab.example.com/your-group' || inputs.target == 'all') && secrets.FSYNC_GITLAB_TOKEN || '' }}
          FSYNC_GITHUB_TOKEN: ${{ (inputs.target == 'github.com/your-org' || inputs.target == 'all') && secrets.FSYNC_GITHUB_TOKEN || '' }}
