#
# Copy to .github/workflows/ in a protected launcher repository. Set the
# repository variables FORGE_SYNC_VERSION and FORGE_SYNC_ARCHIVE_SHA256: a
# hosted runner starts empty, so the job installs that exact release. A push
# never starts this workflow. Destination options are the
# names under mirrors: in ci/forgesync.yaml.
name: Mirror to another forge
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Destination (Git branches and tags are always copied; all = every destination)"
        type: choice
        default: gitlab.example.com/your-group
        options: [gitlab.example.com/your-group, github.com/your-org, all]
      issues:
        description: "Also copy issues (with their labels and milestones)"
        type: boolean
        default: false
      pull_requests:
        description: "Also copy pull requests (as issues)"
        type: boolean
        default: false
      releases:
        description: "Also copy releases"
        type: boolean
        default: false
      wiki:
        description: "Also copy the wiki"
        type: boolean
        default: false
      lfs:
        description: "Also copy Git LFS files (large files)"
        type: boolean
        default: false
      mode:
        description: "Preview shows what would change, apply copies"
        type: choice
        default: preview
        options: [preview, apply]
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install digest-pinned Forge Sync
        env:
          FORGE_SYNC_VERSION: ${{ vars.FORGE_SYNC_VERSION }}
          FORGE_SYNC_ARCHIVE_SHA256: ${{ vars.FORGE_SYNC_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          archive="forge-sync-${FORGE_SYNC_VERSION}-linux-x86_64.tar.gz"
          stage=$(mktemp -d)
          curl --fail --location --proto '=https' --silent --show-error --output "$stage/$archive" \
            "https://codefloe.com/itiquette/forge-sync/releases/download/v${FORGE_SYNC_VERSION}/$archive"
          printf '%s  %s\n' "$FORGE_SYNC_ARCHIVE_SHA256" "$stage/$archive" | sha256sum --check --strict -
          tar -xzf "$stage/$archive" -C "$stage"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$stage/${archive%.tar.gz}/forge-sync" "$RUNNER_TEMP/bin/forge-sync"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          include=git
          for choice in "issues:$SYNC_ISSUES" "pull_requests:$SYNC_PULL_REQUESTS" "releases:$SYNC_RELEASES" "wiki:$SYNC_WIKI" "lfs:$SYNC_LFS"; do
            case "$choice" in *:true) include="$include,${choice%:*}" ;; esac
          done
          forge-sync --format plain --config-file ci/forgesync.yaml sync --group production/upstream --target "$SYNC_TARGET" --include "$include" --mode "$SYNC_MODE" --missing-target require --description on-create --target-settings leave
        env:
          SYNC_TARGET: ${{ inputs.target }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_ISSUES: ${{ inputs.issues }}
          SYNC_PULL_REQUESTS: ${{ inputs.pull_requests }}
          SYNC_RELEASES: ${{ inputs.releases }}
          SYNC_WIKI: ${{ inputs.wiki }}
          SYNC_LFS: ${{ inputs.lfs }}
          FSYNC_FORGEJO_TOKEN: ${{ secrets.FSYNC_FORGEJO_TOKEN }}
          # Each destination's token reaches the job only when it is selected.
          # Add one such line per destination in ci/forgesync.yaml, with the same name.
          FSYNC_GITLAB_TOKEN: ${{ (inputs.target == 'gitlab.example.com/your-group' || inputs.target == 'all') && secrets.FSYNC_GITLAB_TOKEN || '' }}
          FSYNC_GITHUB_TOKEN: ${{ (inputs.target == 'github.com/your-org' || inputs.target == 'all') && secrets.FSYNC_GITHUB_TOKEN || '' }}
